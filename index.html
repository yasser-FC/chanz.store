<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة | Website Under Maintenance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Tajawal for Arabic & Inter for English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            font-family: 'Tajawal', 'Inter', sans-serif;
        }

        /* Animated Vibrant Mesh Background */
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #020617);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glowing Animated Text Effect */
        .glow-text {
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc, #f472b6);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glowGradient 5s ease infinite alternate;
        }

        @keyframes glowGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* Floating Gear Animation */
        .float-gear {
            animation: float 6s ease-in-out infinite;
        }

        .spin-slow {
            animation: spin 15s linear infinite;
        }

        .spin-reverse {
            animation: spinReverse 20s linear infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Subtle Pulse Effect for Card */
        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(129, 140, 248, 0.15);
        }

        /* Progress Bar Animation */
        .progress-line {
            width: 0%;
            animation: fillProgress 3s ease-in-out infinite alternate;
        }

        @keyframes fillProgress {
            0% { width: 15%; }
            100% { width: 85%; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 md:p-8 text-white relative">

    <!-- Decorative Floating Glowing Orbs -->
    <div class="absolute top-1/4 left-10 w-72 h-72 bg-purple-600/30 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
    <div class="absolute bottom-1/4 right-10 w-80 h-80 bg-blue-600/30 rounded-full blur-3xl pointer-events-none animate-pulse" style="animation-delay: 2s;"></div>

    <!-- Main Maintenance Container -->
    <main class="w-full max-w-4xl glass-card rounded-3xl p-6 md:p-12 text-center relative z-10 my-auto border border-white/10">
        
        <!-- Animated Icon Header -->
        <div class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center float-gear">
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 to-fuchsia-500 rounded-full blur-lg opacity-50"></div>
            <div class="relative w-full h-full rounded-2xl bg-slate-900/80 border border-white/20 flex items-center justify-center overflow-hidden">
                <i class="fa-solid fa-gear text-5xl text-cyan-400 spin-slow absolute -top-1 -right-1 opacity-80"></i>
                <i class="fa-solid fa-screwdriver-wrench text-4xl text-fuchsia-400 relative z-10"></i>
                <i class="fa-solid fa-gear text-3xl text-indigo-400 spin-reverse absolute -bottom-2 -left-2 opacity-80"></i>
            </div>
        </div>

        <!-- Arabic Message Header -->
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-black mb-4 leading-tight glow-text tracking-wide">
            الموقع تحت الصيانة
        </h1>

        <!-- Arabic Sub-message -->
        <p class="text-xl md:text-3xl font-bold text-slate-200 mb-6 flex items-center justify-center gap-3 flex-wrap">
            <span>انتظر قليلاً</span>
            <span class="inline-block w-2 h-2 rounded-full bg-pink-500 animate-ping"></span>
            <span class="text-cyan-400">جاري تحديث الموقع...</span>
        </p>

        <!-- Divider Line with Progress Animation -->
        <div class="w-full max-w-md mx-auto bg-slate-800/80 h-2 rounded-full overflow-hidden mb-8 border border-white/5">
            <div class="bg-gradient-to-r from-cyan-400 via-indigo-500 to-pink-500 h-full rounded-full progress-line"></div>
        </div>

        <!-- English Message Section -->
        <div class="space-y-2 mb-10 dir-ltr font-sans">
            <h2 class="text-xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-slate-100 via-purple-200 to-slate-300 tracking-wider uppercase">
                Website Under Maintenance
            </h2>
            <p class="text-slate-400 text-sm md:text-lg font-medium">
                Please wait a moment, we are updating the site for a better experience.
            </p>
        </div>

        <!-- Features / Status Chips -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-2xl mx-auto mb-8 text-sm">
            <div class="p-3 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt text-amber-400"></i>
                <span>تحسين السرعة والأداء</span>
            </div>
            <div class="p-3 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                <span>تحديثات الأمان</span>
            </div>
            <div class="p-3 rounded-xl bg-white/5 border border-white/10 backdrop-blur-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i>
                <span>ميزات جديدة قريباً</span>
            </div>
        </div>

        <!-- Developer Contact Action Button -->
        <div class="pt-2">
            <a href="tel:67011143" class="inline-flex px-8 py-3.5 rounded-full bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold text-base shadow-lg shadow-indigo-500/30 hover:shadow-cyan-500/50 hover:scale-105 active:scale-95 transition-all duration-300 items-center justify-center gap-2 mx-auto">
                <i class="fa-solid fa-headset"></i>
                <span>مراجعة المطور Yasser 67011143</span>
            </a>
        </div>

    </main>

    <!-- Footer Copyright / Branding -->
    <footer class="absolute bottom-4 text-center w-full text-xs text-slate-500 font-light z-10">
        &copy; <span id="year"></span> جميع الحقوق محفوظة | All rights reserved
    </footer>

    <!-- Interactive Script -->
    <script>
        // Set Current Year dynamically
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
