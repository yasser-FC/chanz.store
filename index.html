function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s&&s.clinics&&s.items&&s.transactions)return s}}catch(e){console.warn(e)}return demoState()}
state=loadState();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));const el=document.getElementById('storageStatus');if(el)el.textContent='✓ محفوظ محليًا على هذا الجهاز'}catch(e){toast('تعذر الحفظ: مساحة التخزين ممتلئة');}}
function deviceLabel(){const ua=navigator.userAgent||'';if(/iPhone/i.test(ua))return 'iPhone';if(/iPad/i.test(ua))return 'iPad';if(/Android/i.test(ua)&&/Mobile/i.test(ua))return 'هاتف Android';if(/Android/i.test(ua))return 'جهاز Android لوحي';if(/Windows/i.test(ua))return 'كمبيوتر Windows';if(/Macintosh|Mac OS/i.test(ua))return 'كمبيوتر Mac';return 'جهاز غير محدد'}
function audit(action,entity,details){state.logs.unshift({id:uid('log'),time:new Date().toISOString(),user:currentUser?.name||'غير مسجل',role:currentUser?.role||'guest',action,entity,details,device:navigator.userAgent,deviceType:deviceLabel(),platform:navigator.platform||'غير معروف',language:navigator.language||'غير معروف',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'غير معروف',screen:`${screen.width}×${screen.height}`});if(state.logs.length>5000)state.logs.length=5000;save()}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',3000)}
function getItem(id){return state.items.find(x=>x.id===id)}function getClinic(id){return state.clinics.find(x=>x.id===id)}function getSupplier(id){return state.suppliers.find(x=>x.id===id)}
function calcInventory(asOf=todayISO()){
 const bal={};const avg={};state.items.forEach(it=>{bal[it.id]={};state.clinics.forEach(c=>bal[it.id][c.id]=Number(it.initialStock?.[c.id]||0));avg[it.id]=Number(it.initialCost||it.avgCost||0)});
 const txs=[...state.transactions].filter(t=>t.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
 txs.forEach(t=>{(t.lines||[]).forEach(l=>{if(!bal[l.itemId])return;const q=Number(l.qty)||0;const totalBefore=Object.values(bal[l.itemId]).reduce((x,y)=>x+y,0);if(t.type==='purchase'){const p=Number(l.unitCost)||0;avg[l.itemId]=totalBefore+q>0?((totalBefore*avg[l.itemId]+q*p)/(totalBefore+q)):p;bal[l.itemId][MAIN_ID]=(bal[l.itemId][MAIN_ID]||0)+q;}else if(t.type==='transfer'){bal[l.itemId][t.fromId]=(bal[l.itemId][t.fromId]||0)-q;bal[l.itemId][t.toId]=(bal[l.itemId][t.toId]||0)+q;}else if(t.type==='return'||t.type==='loss'){bal[l.itemId][t.locationId]=(bal[l.itemId][t.locationId]||0)-q;}})});
 return {balances:bal,avgCosts:avg};
}
function stockAt(itemId,locationId,asOf=todayISO()){const c=calcInventory(asOf);return Number(c.balances[itemId]?.[locationId]||0)}
function typeLabel(t){return ({purchase:'مشتريات',transfer:'تحويل',return:'مرتجع مورد',loss:'تالف / مفقود'})[t]||t}
function nextNumber(prefix){const nums=state.transactions.map(t=>{const m=(t.number||'').match(/(\d+)$/);return m?Number(m[1]):0});const n=Math.max(state.counter||1,...nums)+1;state.counter=n;return `${prefix}-${String(n).padStart(4,'0')}`}
function login(password){if(password==='123'){currentUser={name:'المستخدم العادي',role:'user'}}else if(password==='885522'){currentUser={name:'مدير النظام',role:'manager'}}else return false;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appShell').classList.remove('hidden');document.getElementById('userLabel').textContent=currentUser.name;applyRole();audit('تسجيل دخول','النظام',`تم تسجيل الدخول من ${navigator.platform||'جهاز غير معروف'}`);audit('فتح البرنامج','النظام','بدء جلسة استخدام');navigate('dashboard');return true}
function logout(){audit('تسجيل خروج','النظام','إنهاء جلسة الاستخدام');currentUser=null;document.getElementById('appShell').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('loginPassword').value=''}

function navigate(page){if((page==='audit'||page==='settings')&&currentUser?.role!=='manager'){toast('هذه الصفحة متاحة للمدير فقط');return}currentPage=page;const labels={dashboard:'لوحة التحكم',inventory:'المخزون والجرد',purchases:'المشتريات',transfers:'التحويلات',returns:'مرتجعات الموردين',losses:'التوالف والمفقودات',suppliers:'الموردون',reports:'التقارير',audit:'حركة السجل',settings:'الإعدادات'};if(currentUser)audit('فتح صفحة','واجهة البرنامج',`فتح صفحة ${labels[page]||page}`);document.querySelectorAll('.nav-btn,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderPage()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){navigate(b.dataset.page)}});
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="head-actions">${actions}</div></div>`}
function renderPage(){const m=document.getElementById('mainContent');const render={dashboard:renderDashboard,inventory:renderInventory,purchases:renderPurchases,transfers:renderTransfers,returns:renderReturns,losses:renderLosses,suppliers:renderSuppliers,reports:renderReports,audit:renderAudit,settings:renderSettings}[currentPage]||renderDashboard;m.innerHTML=render();if(currentPage==='reports')initReportFilters();}
function renderDashboard(){const c=calcInventory(),items=state.items;let qty=0,value=0,low=0;items.forEach(it=>{const q=Object.values(c.balances[it.id]||{}).reduce((a,b)=>a+b,0);qty+=q;value+=q*(c.avgCosts[it.id]||0);if(q<=it.minStock)low++});const recent=[...state.transactions].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,6);const clinicCount=state.clinics.filter(x=>x.id!==MAIN_ID).length;
 return `${pageHead('لوحة التحكم','نظرة سريعة على حالة مخزون مركز شانزيليزيه')}
 <div class="grid stats"><div class="stat"><div class="label">إجمالي الأصناف المسجلة</div><div class="value">${items.length}</div><div class="note">صنف / مادة طبية</div></div><div class="stat"><div class="label">إجمالي الوحدات المتاحة</div><div class="value">${qtyfmt(qty)}</div><div class="note">في جميع المخازن والعيادات</div></div><div class="stat"><div class="label">القيمة التقديرية للمخزون</div><div class="value" style="font-size:20px">${money(value)} <small style="font-size:10px">د.ك</small></div><div class="note">حسب متوسط تكلفة الصنف</div></div><div class="stat"><div class="label">أصناف عند حد إعادة الطلب</div><div class="value" style="color:${low?'#bc6e34':'#23815d'}">${low}</div><div class="note">من أصل ${items.length} صنف</div></div></div>
 <div class="grid two-col"><section class="panel"><div class="panel-head"><div><h3>اختصارات العمليات</h3><div class="sub">تسجيل حركة مخزنية جديدة</div></div></div><div class="quick-actions"><button class="quick" onclick="navigate('purchases')"><span>🛒</span><span>سند مشتريات جديد</span></button><button class="quick" onclick="navigate('transfers')"><span>⇄</span><span>تحويل أصناف لعيادة</span></button><button class="quick" onclick="navigate('returns')"><span>↶</span><span>مرتجع إلى مورد</span></button><button class="quick" onclick="navigate('losses')"><span>⚠️</span><span>تسجيل تالف أو مفقود</span></button></div></section><section class="panel"><div class="panel-head"><div><h3>ملخص المواقع</h3><div class="sub">الرصيد الحالي بكل مخزن</div></div><span class="badge blue">${clinicCount} عيادات</span></div><div>${state.clinics.map(cl=>{let q=items.reduce((a,it)=>a+stockAt(it.id,cl.id),0);return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f1;font-size:11px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${esc(cl.color||'#176b66')};margin-left:7px"></i>${esc(cl.name)}</span><b class="num">${qtyfmt(q)} وحدة</b></div>`}).join('')}</div></section></div>
 <section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>آخر الحركات المسجلة</h3><div class="sub">أحدث ست حركات</div></div><button class="btn sm" onclick="navigate('reports')">عرض التقارير</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>رقم السند</th><th>نوع الحركة</th><th>التاريخ</th><th>التفاصيل</th><th>عدد الأصناف</th></tr></thead><tbody>${recent.map(t=>`<tr><td class="ltr">${esc(t.number)}</td><td><span class="badge ${t.type==='purchase'?'green':t.type==='transfer'?'blue':t.type==='loss'?'red':'orange'}">${typeLabel(t.type)}</span></td><td>${fmtDate(t.date)}</td><td>${esc(txSummary(t))}</td><td>${t.lines.length}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">لا توجد حركات بعد</div>`}</section>`}
function txSummary(t){if(t.type==='transfer')return `${getClinic(t.fromId)?.name||'—'} ← ${getClinic(t.toId)?.name||'—'}`;if(t.type==='purchase')return getSupplier(t.supplierId)?.name||'مورد غير محدد';if(t.type==='return')return getSupplier(t.supplierId)?.name||'مورد';return getClinic(t.locationId)?.name||'مخزن'}
function renderInventory(){const c=calcInventory();return `${pageHead('المخزون والجرد','رصيد كل صنف وتكلفته موزعة على المخازن والعيادات',`<button class="btn primary" onclick="navigate('reports')">▥ تقرير الجرد PDF</button>`)}<div class="panel"><div class="filters"><div class="filter-search"><input id="invSearch" class="searchbox" placeholder="ابحث باسم الصنف أو الباركود أو رقم الصنف..." oninput="filterTable('inventoryTable',this.value)" /></div><div class="filter-small"><select id="invLocation" class="searchbox" onchange="filterInventoryLocation(this.value)"><option value="all">كل المواقع</option>${state.clinics.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div></div><div class="table-wrap"><table id="inventoryTable"><thead><tr><th>الصنف</th><th>الكود / الباركود</th><th>الوحدة</th><th>المخزن الرئيسي</th>${state.clinics.filter(x=>x.id!==MAIN_ID).map(x=>`<th>${esc(x.name)}</th>`).join('')}<th>الإجمالي</th><th>تكلفة الوحدة</th><th>قيمة الرصيد</th><th>الحالة</th></tr></thead><tbody>${state.items.map(it=>{const total=Object.values(c.balances[it.id]||{}).reduce((a,b)=>a+b,0),avg=c.avgCosts[it.id]||0;return `<tr data-item-row="${esc(it.id)}" data-search="${esc((it.name+' '+it.sku+' '+it.barcode).toLowerCase())}"><td><b>${esc(it.name)}</b></td><td class="ltr">${esc(it.sku)}<br><span class="muted tiny">${esc(it.barcode)}</span></td><td>${esc(it.unit)}</td><td class="num">${qtyfmt(c.balances[it.id]?.[MAIN_ID]||0)}</td>${state.clinics.filter(x=>x.id!==MAIN_ID).map(x=>`<td class="num">${qtyfmt(c.balances[it.id]?.[x.id]||0)}</td>`).join('')}<td><b class="num">${qtyfmt(total)}</b></td><td class="num">${money(avg)} د.ك</td><td class="num">${money(total*avg)} د.ك</td><td>${total<=it.minStock?'<span class="badge red">إعادة طلب</span>':'<span class="badge green">متوفر</span>'}</td></tr>`}).join('')}</tbody></table></div><div class="toolbar"><span class="muted tiny">عدد الأصناف: ${state.items.length} · التكلفة محسوبة بمتوسط التكلفة المرجح</span><button class="btn sm" onclick="exportBackup()">⬇ نسخة احتياطية</button></div></div>`}
function filterTable(id,q){const search=q.trim().toLowerCase();document.querySelectorAll(`#${id} tbody tr`).forEach(r=>r.style.display=(r.dataset.search||'').includes(search)?'':'none')}
function filterInventoryLocation(loc){document.querySelectorAll('#inventoryTable tbody tr').forEach(r=>{if(!r.dataset.itemRow)return;const it=getItem(r.dataset.itemRow);const q=loc==='all'?Object.values(calcInventory().balances[it.id]||{}).reduce((a,b)=>a+b,0):stockAt(it.id,loc);r.style.display=(q>0||loc==='all')?'':'none'})}
function renderPurchases(){return `${pageHead('سندات المشتريات','تسجيل التوريدات وإضافة الأصناف والموردين مباشرة',`<button class="btn primary" onclick="openPurchaseForm()">＋ سند مشتريات جديد</button>`)}<section class="panel"><div class="panel-head"><div><h3>سجل المشتريات</h3><div class="sub">قائمة فواتير التوريد الواردة للمخزن الرئيسي</div></div><input class="searchbox" style="max-width:220px" placeholder="بحث برقم السند أو المورد" oninput="filterTable('purchaseTable',this.value)" /></div>${transactionTable('purchase','purchaseTable')}</section>`}
function renderTransfers(){return `${pageHead('تحويلات العيادات','تسجيل تحويل الأصناف بين المخزن الرئيسي والعيادات أو فيما بينها',`<button class="btn primary" onclick="openMovementForm('transfer')">⇄ تحويل جديد</button>`)}<section class="panel"><div class="panel-head"><div><h3>سجل التحويلات</h3><div class="sub">تتبع الكميات المحولة وتكلفتها لكل عيادة</div></div><input class="searchbox" style="max-width:220px" placeholder="بحث برقم التحويل أو الموقع" oninput="filterTable('transferTable',this.value)" /></div>${transactionTable('transfer','transferTable')}</section>`}

function renderLosses(){return `${pageHead('التوالف والمفقودات','تسجيل العجز أو التلف مع تحديد الموقع والسبب',`<button class="btn primary" onclick="openMovementForm('loss')">＋ تسجيل تالف / مفقود</button>`)}<section class="panel"><div class="panel-head"><div><h3>سجل التوالف والمفقودات</h3><div class="sub">خصم الكميات التالفة أو المفقودة من رصيد الموقع</div></div></div>${transactionTable('loss','lossTable')}</section>`}
function transactionTable(type,id){const arr=[...state.transactions].filter(t=>t.type===type).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(!arr.length)return `<div class="empty">لا توجد سجلات في هذه الصفحة</div>`;return `<div class="table-wrap"><table id="${id}"><thead><tr><th>رقم السند</th><th>التاريخ</th><th>${type==='purchase'||type==='return'?'المورد':type==='transfer'?'من / إلى':'الموقع'}</th><th>الأصناف</th><th>الكمية</th><th>القيمة التقديرية</th><th>ملاحظات</th><th>إجراء</th></tr></thead><tbody>${arr.map(t=>{const calc=calcInventory(t.date),cost=t.lines.reduce((s,l)=>s+l.qty*(type==='purchase'?l.unitCost:(calc.avgCosts[l.itemId]||0)),0);return `<tr data-search="${esc((t.number+' '+txSummary(t)+' '+(t.notes||'')).toLowerCase())}"><td class="ltr"><b>${esc(t.number)}</b></td><td>${fmtDate(t.date)}</td><td>${esc(txSummary(t))}</td><td>${t.lines.map(l=>esc(getItem(l.itemId)?.name||'صنف محذوف')).join('، ')}</td><td class="num">${qtyfmt(t.lines.reduce((s,l)=>s+Number(l.qty),0))}</td><td class="num">${money(cost)} د.ك</td><td>${esc(t.notes||'—')}</td><td><button class="btn sm danger" onclick="deleteTransaction('${t.id}')">حذف</button></td></tr>`}).join('')}</tbody></table></div>`}
function deleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirm(`هل تريد حذف السند ${t.number}؟ سيتم إعادة احتساب الأرصدة بعد الحذف.`))return;state.transactions=state.transactions.filter(x=>x.id!==id);audit('حذف',typeLabel(t.type),`حذف السند ${t.number} — ${txSummary(t)}`);renderPage();toast('تم حذف السند وإعادة احتساب الأرصدة')}
function renderSuppliers(){return `${pageHead('الموردون','إدارة بيانات الموردين المرتبطين بسندات المشتريات والمرتجعات',`<button class="btn primary" onclick="openSupplierForm()">＋ مورد جديد</button>`)}<section class="panel"><div class="filters"><div class="filter-search"><input class="searchbox" placeholder="ابحث باسم المورد أو الهاتف" oninput="filterTable('supplierTable',this.value)" /></div></div><div class="table-wrap"><table id="supplierTable"><thead><tr><th>اسم المورد</th><th>الهاتف</th><th>البريد الإلكتروني</th><th>العنوان</th><th>عدد الحركات</th><th>إجراءات</th></tr></thead><tbody>${state.suppliers.map(s=>`<tr data-search="${esc((s.name+' '+s.phone+' '+s.email).toLowerCase())}"><td><b>${esc(s.name)}</b></td><td class="ltr">${esc(s.phone||'—')}</td><td class="ltr">${esc(s.email||'—')}</td><td>${esc(s.address||'—')}</td><td>${state.transactions.filter(t=>t.supplierId===s.id).length}</td><td><button class="btn sm" onclick="openSupplierForm('${s.id}')">تعديل</button> <button class="btn sm danger" onclick="deleteSupplier('${s.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div></section>`}
function openSupplierForm(id=''){const s=id?getSupplier(id):{};showModal(id?'تعديل بيانات مورد':'إضافة مورد جديد',`<form id="supplierForm"><div class="form-grid two"><div class="field"><label>اسم المورد *</label><input name="name" required value="${esc(s.name||'')}" /></div><div class="field"><label>رقم الهاتف</label><input name="phone" value="${esc(s.phone||'')}" /></div><div class="field"><label>البريد الإلكتروني</label><input name="email" type="email" value="${esc(s.email||'')}" /></div><div class="field"><label>العنوان</label><input name="address" value="${esc(s.address||'')}" /></div></div></form>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveSupplier('${id}')">حفظ المورد</button>`)}
function saveSupplier(id){const f=document.getElementById('supplierForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(id){Object.assign(getSupplier(id),v);audit('تعديل','مورد',`تعديل بيانات المورد ${v.name}`)}else{state.suppliers.push({id:uid('sp'),...v});audit('إضافة','مورد',`إضافة المورد ${v.name}`)}save();closeModal();renderPage();toast('تم حفظ بيانات المورد')}
function deleteSupplier(id){const s=getSupplier(id);if(state.transactions.some(t=>t.supplierId===id)){toast('لا يمكن حذف مورد مرتبط بحركات مسجلة');return}if(!confirm(`حذف المورد ${s.name}؟`))return;state.suppliers=state.suppliers.filter(x=>x.id!==id);audit('حذف','مورد',`حذف المورد ${s.name}`);renderPage()}
function renderAudit(){if(currentUser?.role!=='manager')return '<div class="panel">غير مصرح</div>';return `${pageHead('حركة السجل','سجل تدقيق يتضمن الدخول والعمليات والتعديلات والحذف وبيانات المتصفح والجهاز',`<button class="btn" onclick="exportAuditCSV()">⬇ تصدير CSV</button>`)}<section class="panel"><div class="filters"><div class="filter-search"><input class="searchbox" placeholder="ابحث بالمستخدم أو العملية أو التفاصيل" oninput="filterTable('auditTable',this.value)" /></div><div class="filter-small"><select class="searchbox" onchange="filterAudit(this.value)"><option value="all">كل العمليات</option><option value="تسجيل دخول">تسجيل دخول</option><option value="فتح البرنامج">فتح البرنامج</option><option value="إضافة">إضافة</option><option value="تعديل">تعديل</option><option value="حذف">حذف</option></select></div></div><div class="table-wrap"><table id="auditTable"><thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>القسم</th><th>التفاصيل</th><th>بيانات الجهاز والمتصفح</th></tr></thead><tbody>${state.logs.map(l=>`<tr data-search="${esc((l.user+' '+l.action+' '+l.entity+' '+l.details+' '+l.device).toLowerCase())}" data-action="${esc(l.action)}"><td class="num">${new Date(l.time).toLocaleString('ar-KW')}</td><td>${esc(l.user)}<br><span class="tiny muted">${l.role==='manager'?'مدير':'عادي'}</span></td><td><span class="badge ${l.action==='حذف'?'red':l.action==='إضافة'?'green':l.action==='تعديل'?'orange':'blue'}">${esc(l.action)}</span></td><td>${esc(l.entity)}</td><td>${esc(l.details)}</td><td><span class="tiny">${esc(l.deviceType||'جهاز')} · ${esc(l.platform)} · ${esc(l.screen)}</span><br><span class="tiny muted">${esc(l.language||'')} · ${esc(l.timezone||'')}<br>${esc(l.device).slice(0,115)}</span></td></tr>`).join('')}</tbody></table></div><div class="toolbar"><span class="tiny muted">عدد السجلات: ${state.logs.length} · يحتفظ النظام بآخر 5000 سجل</span></div></section>`}
function filterAudit(action){document.querySelectorAll('#auditTable tbody tr').forEach(r=>r.style.display=action==='all'||r.dataset.action===action?'':'none')}
function renderSettings(){if(currentUser?.role!=='manager')return '<div class="panel">غير مصرح</div>';return `${pageHead('الإعدادات','إدارة أسماء العيادات والأصناف وتهيئة بيانات النظام')}<div class="grid two-col"><section class="panel"><div class="panel-head"><div><h3>العيادات والمخازن</h3><div class="sub">إضافة أو تعديل أسماء المواقع</div></div><button class="btn primary sm" onclick="openClinicForm()">＋ إضافة</button></div>${state.clinics.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf1f0"><span><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${esc(c.color||'#176b66')};margin-left:8px"></i>${esc(c.name)} ${c.id===MAIN_ID?'<span class="badge gray">رئيسي</span>':''}</span><span><button class="btn sm" onclick="openClinicForm('${c.id}')">تعديل</button> ${c.id!==MAIN_ID?`<button class="btn sm danger" onclick="deleteClinic('${c.id}')">حذف</button>`:''}</span></div>`).join('')}</section><section class="panel"><div class="panel-head"><div><h3>الأصناف</h3><div class="sub">تعديل الاسم والكود والباركود والوحدة وحد الطلب والأرصدة الافتتاحية لكل مخزن</div></div><button class="btn primary sm" onclick="openItemForm()">＋ إضافة صنف</button></div><div class="filters"><input class="searchbox" placeholder="بحث عن صنف" oninput="filterTable('settingsItemTable',this.value)" /></div><div class="table-wrap"><table id="settingsItemTable"><thead><tr><th>الصنف</th><th>رقم الصنف</th><th>الباركود</th><th>الوحدة</th><th>حد الطلب</th><th>إجراء</th></tr></thead><tbody>${state.items.map(i=>`<tr data-search="${esc((i.name+' '+i.sku+' '+i.barcode).toLowerCase())}"><td><b>${esc(i.name)}</b></td><td class="ltr">${esc(i.sku)}</td><td class="ltr">${esc(i.barcode)}</td><td>${esc(i.unit)}</td><td>${qtyfmt(i.minStock)}</td><td><button class="btn sm" onclick="openItemForm('${i.id}')">تعديل</button> <button class="btn sm danger" onclick="deleteItem('${i.id}')">حذف</button></td></tr>`).join('')}</tbody></table></div></section></div><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3>النسخ الاحتياطي والبيانات</h3><div class="sub">احفظ نسخة من البيانات أو استعد نسخة سابقة</div></div></div><div class="head-actions"><button class="btn" onclick="exportBackup()">⬇ تنزيل نسخة احتياطية JSON</button><label class="btn" for="importFile">⬆ استيراد نسخة احتياطية</label><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importBackup(event)"/><button class="btn danger" onclick="resetDemo()">إعادة بيانات النسخة التجريبية</button></div><p class="tiny muted" style="line-height:1.9;margin-top:15px">تنبيه تقني: هذه نسخة أولية تحفظ البيانات محليًا في المتصفح. كلمة المرور والصلاحيات داخل ملف HTML ليست حماية إنتاجية، وسجل الأجهزة لا يعرض عنوان IP ولا يضمن جمع سجلات الأجهزة الأخرى. لتشغيل المركز على عدة أجهزة مع قاعدة بيانات مركزية ومستخدمين آمنين يلزم خادم خلفي وقاعدة بيانات.</p></section>`}
function openClinicForm(id=''){const c=id?getClinic(id):{};showModal(id?'تعديل موقع':'إضافة عيادة / مخزن',`<form id="clinicForm"><div class="form-grid two"><div class="field"><label>اسم العيادة / المخزن *</label><input name="name" required value="${esc(c.name||'')}" /></div><div class="field"><label>لون التعريف</label><input name="color" type="color" value="${esc(c.color||'#176b66')}" style="height:40px;padding:4px" /></div></div></form>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveClinic('${id}')">حفظ</button>`)}
function saveClinic(id){const f=document.getElementById('clinicForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(id){Object.assign(getClinic(id),v);audit('تعديل','إعدادات العيادات',`تعديل اسم الموقع إلى ${v.name}`)}else{state.clinics.push({id:uid('cl'),kind:'clinic',...v});audit('إضافة','إعدادات العيادات',`إضافة الموقع ${v.name}`)}save();closeModal();renderPage()}
function deleteClinic(id){const c=getClinic(id);if(state.transactions.some(t=>t.fromId===id||t.toId===id||t.locationId===id)||state.items.some(i=>(i.initialStock?.[id]||0)!==0)){toast('لا يمكن حذف موقع لديه أرصدة أو حركات سابقة');return}if(!confirm(`حذف ${c.name}؟`))return;state.clinics=state.clinics.filter(x=>x.id!==id);audit('حذف','إعدادات العيادات',`حذف الموقع ${c.name}`);save();renderPage()}
function openItemForm(id=''){const i=id?getItem(id):{};showModal(id?'تعديل بيانات الصنف':'إضافة صنف جديد',`<form id="itemForm"><div class="form-grid two"><div class="field"><label>اسم الصنف *</label><input name="name" required value="${esc(i.name||'')}" /></div><div class="field"><label>رقم الصنف / SKU *</label><input name="sku" required value="${esc(i.sku||'')}" /></div><div class="field"><label>الباركود</label><input name="barcode" value="${esc(i.barcode||'')}" /></div><div class="field"><label>الوحدة *</label><input name="unit" required value="${esc(i.unit||'علبة')}" /></div><div class="field"><label>حد إعادة الطلب</label><input name="minStock" type="number" min="0" step="0.001" value="${esc(i.minStock??5)}" /></div><div class="field"><label>تكلفة افتتاحية للوحدة (د.ك)</label><input name="initialCost" type="number" min="0" step="0.001" value="${esc(i.initialCost??0)}" ${id?'disabled':''} /></div></div>${id?'':'<p class="tiny muted">يمكن تسجيل الرصيد الافتتاحي بعد إنشاء الصنف عبر سند مشتريات أو نسخة لاحقة.</p>'}</form>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveItem('${id}')">حفظ الصنف</button>`)}
function saveItem(id){const f=document.getElementById('itemForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(state.items.some(x=>x.id!==id&&(x.sku===v.sku||(v.barcode&&x.barcode===v.barcode)))){toast('رقم الصنف أو الباركود مستخدم بالفعل');return}v.minStock=Number(v.minStock)||0;if(id){const i=getItem(id);Object.assign(i,{name:v.name,sku:v.sku,barcode:v.barcode,unit:v.unit,minStock:v.minStock});audit('تعديل','صنف',`تعديل بيانات الصنف ${v.name}`)}else{state.items.push({id:uid('it'),name:v.name,sku:v.sku,barcode:v.barcode,unit:v.unit,minStock:v.minStock,avgCost:Number(v.initialCost)||0,initialCost:Number(v.initialCost)||0,initialStock:{[MAIN_ID]:0}});audit('إضافة','صنف',`إضافة الصنف ${v.name} (${v.sku})`)}save();closeModal();if(currentPage==='settings')renderPage();toast('تم حفظ الصنف')}
function deleteItem(id){const i=getItem(id);if(state.transactions.some(t=>t.lines.some(l=>l.itemId===id))||Object.values(i.initialStock||{}).some(q=>q>0)){toast('لا يمكن حذف صنف مرتبط برصيد أو حركة سابقة');return}if(!confirm(`حذف الصنف ${i.name}؟`))return;state.items=state.items.filter(x=>x.id!==id);audit('حذف','صنف',`حذف الصنف ${i.name}`);save();renderPage()}
function showModal(title,body,footer){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="xbtn" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer}</div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function comboHTML(id,label,placeholder,kind,required=true){return `<div class="field"><label>${label}${required?' *':''}</label><div class="combo" data-combo="${id}" data-kind="${kind}"><input id="${id}Input" autocomplete="off" placeholder="${placeholder}" ${required?'required':''} /><input type="hidden" id="${id}" value="" /><div class="combo-menu" id="${id}Menu"></div></div></div>`}
function setupCombo(id,kind,selected=''){const wrap=document.querySelector(`[data-combo="${id}"]`);if(!wrap)return;const input=wrap.querySelector('input:not([type=hidden])'),hidden=document.getElementById(id),menu=document.getElementById(id+'Menu');let list=kind==='item'?state.items:kind==='clinic'?state.clinics:state.suppliers;const getLabel=o=>kind==='item'?`${o.name} · ${o.sku} · ${o.barcode}`:o.name;function render(q=''){const items=list.filter(o=>{const hay=kind==='item'?[o.name,displayName(o.name),o.sku,o.barcode].join(' '):[o.name,displayName(o.name)].join(' ');return hay.toLowerCase().includes(q.toLowerCase())});menu.innerHTML=items.length?items.slice(0,30).map(o=>`<div class="combo-option" data-id="${o.id}"><span>${esc(getLabel(o))}</span><span class="tag">${kind==='item'?esc(o.unit):kind==='clinic'?(o.id===MAIN_ID?'مخزن رئيسي':'عيادة'):'مورد'}</span></div>`).join(''):(kind==='supplier'&&id==='purchaseSupplier'?'<div class="combo-option" data-add-supplier="1"><span>＋ إضافة مورد جديد بهذا الاسم</span><span class="tag">مورد جديد</span></div>':'<div class="empty">لا توجد نتائج مطابقة</div>');wrap.classList.add('open')};input.addEventListener('focus',()=>render(input.value));input.addEventListener('input',()=>{hidden.value='';render(input.value)});menu.addEventListener('click',e=>{if(e.target.closest('[data-add-supplier]')){wrap.classList.remove('open');openSupplierFormForPurchase();return}const option=e.target.closest('.combo-option');if(!option)return;const o=list.find(x=>x.id===option.dataset.id);if(!o)return;hidden.value=o.id;input.value=getLabel(o);wrap.classList.remove('open');hidden.dispatchEvent(new Event('change'))});document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open')});if(selected){const o=list.find(x=>x.id===selected);if(o){hidden.value=o.id;input.value=getLabel(o)}}return {input,hidden,render};}
function itemPick(id,selected=''){return setupCombo(id,'item',selected)}
let movementLines=[];
function capturePurchaseDraft(){const f=document.getElementById('purchaseForm');if(!f)return null;const v=Object.fromEntries(new FormData(f));v.supplierId=document.getElementById('purchaseSupplier')?.value||'';v.lines=movementLines.map(l=>({itemId:document.getElementById(l.id+'Item')?.value||'',qty:Number(document.getElementById(l.id+'Qty')?.value)||1,unitCost:Number(document.getElementById(l.id+'Cost')?.value)||0})).filter(l=>l.itemId);return v}
function openPurchaseForm(draft=null){movementLines=[];showModal('سند مشتريات جديد',`<form id="purchaseForm"><div class="form-grid two">${comboHTML('purchaseSupplier','المورد','اكتب اسم المورد للبحث','supplier')}<div class="field"><label>تاريخ الفاتورة *</label><input type="date" name="date" required value="${esc(draft?.date||todayISO())}" /></div><div class="field"><label>رقم فاتورة المورد</label><input name="supplierInvoice" placeholder="اختياري" value="${esc(draft?.supplierInvoice||'')}" /></div><div class="field"><label>ملاحظات</label><input name="notes" placeholder="ملاحظات السند" value="${esc(displayName(draft?.notes||''))}" /></div></div><div class="form-section"><h4>الأصناف المشتراة</h4><div id="purchaseLines"></div><div class="toolbar"><button type="button" class="btn sm" onclick="addMovementLine('purchase')">＋ إضافة صنف</button><button type="button" class="btn sm gold" onclick="openItemFormForPurchase()">＋ صنف جديد</button><button type="button" class="btn sm gold" onclick="openSupplierFormForPurchase()">＋ مورد جديد</button></div></div><div class="toolbar"><b>إجمالي الفاتورة</b><strong id="movementTotal" class="num">0.000 د.ك</strong></div></form>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveMovement('purchase')">حفظ سند المشتريات</button>`);setupCombo('purchaseSupplier','supplier',draft?.supplierId||'');if(draft?.lines?.length){draft.lines.forEach(l=>{addMovementLine('purchase',l.itemId);const row=movementLines[movementLines.length-1];document.getElementById(row.id+'Qty').value=l.qty;document.getElementById(row.id+'Cost').value=Number(l.unitCost).toFixed(3)})}else addMovementLine('purchase');updateMovementTotal()}
function openItemFormForPurchase(){const draft=capturePurchaseDraft();window._purchaseDraft=draft;showModal('إضافة صنف من سند المشتريات',`<form id="quickItemForm"><div class="form-grid two"><div class="field"><label>اسم الصنف *</label><input name="name" required /></div><div class="field"><label>رقم الصنف / SKU *</label><input name="sku" required /></div><div class="field"><label>الباركود</label><input name="barcode" /></div><div class="field"><label>الوحدة *</label><input name="unit" required value="${esc(displayName('علبة'))}" /></div><div class="field"><label>حد إعادة الطلب</label><input name="minStock" type="number" min="0" value="5" /></div></div></form>`,`<button class="btn" onclick="openPurchaseForm(window._purchaseDraft)">رجوع</button><button class="btn primary" onclick="saveQuickItem()">حفظ وإضافة للسند</button>`)}

function saveQuickSupplier(){const f=document.getElementById('quickSupplierForm');if(!f.reportValidity())return;const v=Object.fromEntries(new FormData(f));if(state.suppliers.some(x=>x.name.trim().toLowerCase()===v.name.trim().toLowerCase())){toast('هذا المورد مسجل بالفعل');return}const supplier={id:uid('sp'),...v};state.suppliers.push(supplier);audit('إضافة','مورد',`إضافة المورد ${supplier.name} أثناء تسجيل المشتريات`);save();const draft=window._purchaseDraft||{date:todayISO(),lines:[]};draft.supplierId=supplier.id;openPurchaseForm(draft);toast('تم إضافة المورد واختياره للسند')}

function openMovementForm(type){movementLines=[];const isTransfer=type==='transfer',isReturn=type==='return';let fields='';if(isTransfer)fields=`<div class="form-grid two">${comboHTML('moveFrom','من مخزن','ابحث عن المخزن المصدر','clinic')}${comboHTML('moveTo','إلى عيادة / مخزن','ابحث عن الوجهة','clinic')}</div>`;else if(isReturn)fields=`<div class="form-grid two">${comboHTML('moveSupplier','المورد','ابحث عن المورد','supplier')} ${comboHTML('moveLocation','المخزن المصدر','اختر المخزن الذي سيخرج منه المرتجع','clinic')}</div>`;else fields=`<div class="form-grid two">${comboHTML('moveLocation','المخزن / العيادة','اختر الموقع','clinic')}<div class="field"><label>سبب التلف أو الفقد *</label><input name="reason" required placeholder="اكتب سبب الحركة" /></div></div>`;
 showModal(isTransfer?'سند تحويل بين المخازن':isReturn?'سند مرتجع إلى مورد':'تسجيل تالف / مفقود',`<form id="movementForm"><div class="form-grid two">${fields}<div class="field"><label>التاريخ *</label><input type="date" name="date" required value="${todayISO()}" /></div><div class="field"><label>ملاحظات</label><input name="notes" placeholder="ملاحظات إضافية" /></div></div><div class="form-section"><h4>الأصناف والكميات</h4><div id="movementLines"></div><div class="toolbar"><button type="button" class="btn sm" onclick="addMovementLine('${type}')">＋ إضافة صنف</button></div></div></form>`,`<button class="btn" onclick="closeModal()">إلغاء</button><button class="btn primary" onclick="saveMovement('${type}')">حفظ الحركة</button>`);
 if(isTransfer){setupCombo('moveFrom','clinic',MAIN_ID);setupCombo('moveTo','clinic');}else if(isReturn){setupCombo('moveSupplier','supplier');setupCombo('moveLocation','clinic',MAIN_ID)}else setupCombo('moveLocation','clinic',MAIN_ID);addMovementLine(type)}
function addMovementLine(type,selectedItem=''){const container=document.getElementById(type==='purchase'?'purchaseLines':'movementLines');if(!container)return;const id=uid('ln');movementLines.push({id,itemId:selectedItem,qty:1,unitCost:0});const purchase=type==='purchase';const row=document.createElement('div');row.className='line-row';row.id=id;row.innerHTML=`<div class="field item-field"><label>الصنف / امسح الباركود</label><div class="combo" data-line-combo="${id}"><input id="${id}Input" autocomplete="off" placeholder="الاسم أو رقم الصنف أو الباركود" /><input type="hidden" id="${id}Item" value="${selectedItem}" /><div class="combo-menu" id="${id}Menu"></div></div></div><div class="field"><label>الكمية</label><input id="${id}Qty" type="number" step="0.001" min="0.001" value="1" /></div>${purchase?`<div class="field"><label>سعر الوحدة (د.ك)</label><input id="${id}Cost" type="number" step="0.001" min="0" value="0.000" /></div>`:`<div class="line-total" id="${id}CostLabel">—</div>`}<button type="button" class="btn sm danger" onclick="removeMovementLine('${id}')">×</button>`;container.appendChild(row);setupLineCombo(id,selectedItem);row.querySelector(`#${id}Qty`).addEventListener('input',updateMovementTotal);if(purchase)row.querySelector(`#${id}Cost`).addEventListener('input',updateMovementTotal);updateMovementTotal();}
function setupLineCombo(id,selected=''){const wrap=document.querySelector(`[data-line-combo="${id}"]`);if(!wrap)return;const input=wrap.querySelector('input:not([type=hidden])'),hidden=document.getElementById(id+'Item'),menu=document.getElementById(id+'Menu');function render(q=''){const found=state.items.filter(x=>(x.name+' '+displayName(x.name)+' '+x.sku+' '+x.barcode).toLowerCase().includes(q.toLowerCase()));menu.innerHTML=found.slice(0,25).map(x=>`<div class="combo-option" data-id="${x.id}"><span>${esc(x.name)} <span class="muted">${esc(x.sku)}</span></span><span class="tag">${esc(x.barcode)}</span></div>`).join('')||'<div class="empty">لا يوجد صنف مطابق — أضفه من الإعدادات</div>';wrap.classList.add('open')};const choose=x=>{hidden.value=x.id;input.value=`${x.name} · ${x.sku}`;wrap.classList.remove('open');const l=movementLines.find(y=>y.id===id);if(l)l.itemId=x.id;};input.addEventListener('focus',()=>render(input.value));input.addEventListener('input',()=>{hidden.value='';render(input.value)});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const raw=input.value.trim().toLowerCase();const found=state.items.find(x=>x.barcode.toLowerCase()===raw||x.sku.toLowerCase()===raw)||state.items.find(x=>x.name.toLowerCase()===raw);if(found){choose(found);document.getElementById(id+'Qty')?.focus()}else{render(raw);toast('لم يتم العثور على باركود أو رقم صنف مطابق')}}});menu.addEventListener('click',e=>{const o=e.target.closest('.combo-option');if(o){const it=getItem(o.dataset.id);if(it)choose(it)}});document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open')});if(selected){const it=getItem(selected);if(it)choose(it)}}
function removeMovementLine(id){movementLines=movementLines.filter(x=>x.id!==id);document.getElementById(id)?.remove();updateMovementTotal()}

function saveMovement(type){const f=document.getElementById(type==='purchase'?'purchaseForm':'movementForm');if(!f.reportValidity())return;const data=Object.fromEntries(new FormData(f));if(type==='purchase'){data.supplierId=document.getElementById('purchaseSupplier').value;if(!data.supplierId){toast('اختر المورد أو أضفه أولاً');return}}
 if(type==='transfer'){data.fromId=document.getElementById('moveFrom').value;data.toId=document.getElementById('moveTo').value;if(!data.fromId||!data.toId){toast('حدد المخزن المصدر والوجهة');return}if(data.fromId===data.toId){toast('المخزن المصدر والوجهة يجب أن يكونا مختلفين');return}}
 if(type==='return'){data.supplierId=document.getElementById('moveSupplier').value;data.locationId=document.getElementById('moveLocation').value;if(!data.supplierId||!data.locationId){toast('حدد المورد والمخزن');return}}
 if(type==='loss'){data.locationId=document.getElementById('moveLocation').value;if(!data.locationId){toast('حدد المخزن');return}}
 const lines=[];for(const row of movementLines){const itemId=document.getElementById(row.id+'Item')?.value;const qty=Number(document.getElementById(row.id+'Qty')?.value)||0;const unitCost=Number(document.getElementById(row.id+'Cost')?.value)||0;if(!itemId||qty<=0){toast('أكمل الصنف والكمية في جميع السطور');return}lines.push({itemId,qty,...(type==='purchase'?{unitCost}:{})})}if(!lines.length){toast('أضف صنفًا واحدًا على الأقل');return}
 const inv=calcInventory(data.date);for(const l of lines){if(type==='transfer'&&Number(inv.balances[l.itemId]?.[data.fromId]||0)<l.qty){toast(`الرصيد غير كافٍ للصنف: ${getItem(l.itemId).name}`);return}if((type==='return'||type==='loss')&&Number(inv.balances[l.itemId]?.[data.locationId]||0)<l.qty){toast(`الرصيد غير كافٍ للصنف: ${getItem(l.itemId).name}`);return}}
 if(type==='transfer'&&data.fromId!==MAIN_ID&&data.toId===MAIN_ID){/* valid reverse transfer */}
 const prefix={purchase:'PUR',transfer:'TR',return:'RT',loss:'LS'}[type];const tx={id:uid('tx'),type,number:nextNumber(prefix),date:data.date,createdAt:Date.now(),lines,notes:data.notes||''};if(type==='purchase'){tx.supplierId=data.supplierId;tx.supplierInvoice=data.supplierInvoice||''}if(type==='transfer'){tx.fromId=data.fromId;tx.toId=data.toId}if(type==='return'){tx.supplierId=data.supplierId;tx.locationId=data.locationId;tx.reason=data.reason||''}if(type==='loss'){tx.locationId=data.locationId;tx.reason=data.reason||''}
 state.transactions.push(tx);audit('إضافة',typeLabel(type),`تسجيل السند ${tx.number} — ${txSummary(tx)} — ${lines.length} صنف`);save();closeModal();renderPage();toast(`تم حفظ السند ${tx.number}`)}
function reportsDefault(){return {from:monthStart(),to:todayISO(),asOf:todayISO(),clinic:'all',type:'transfers'}}
function renderReports(){const d=reportsDefault();return `${pageHead('التقارير','تقارير الجرد والحركة والتوريد والتوالف مع إمكانية الطباعة والحفظ بصيغة PDF',`<button class="btn" onclick="printLastReport()" id="printReportBtn" disabled>⎙ طباعة / PDF</button>`)}<section class="panel"><div class="form-grid four"><div class="field"><label>نوع التقرير</label><select id="reportType" onchange="buildReport()"><option value="inventory">جرد المخزون وتقييمه</option><option value="transfers" selected>تحويلات الأصناف حسب العيادة</option><option value="purchases">المشتريات حسب المورد</option><option value="returns">مرتجعات الموردين</option><option value="losses">التوالف والمفقودات</option><option value="all">كشف جميع الحركات</option></select></div><div class="field"><label>من تاريخ</label><input id="reportFrom" type="date" value="${d.from}" onchange="buildReport()" /></div><div class="field"><label>إلى تاريخ</label><input id="reportTo" type="date" value="${d.to}" onchange="buildReport()" /></div><div class="field"><label>العيادة / المخزن</label><select id="reportClinic" onchange="buildReport()"><option value="all">كل المواقع</option>${state.clinics.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="toolbar"><div class="tiny muted" id="reportHint">الفترة الافتراضية: من بداية الشهر حتى اليوم</div><button class="btn primary" onclick="buildReport()">إنشاء التقرير</button></div></section><section class="panel" style="margin-top:15px"><div class="panel-head"><div><h3 id="reportPreviewTitle">معاينة التقرير</h3><div class="sub">سيظهر التقرير هنا قبل الطباعة أو الحفظ PDF</div></div><span class="badge green">جاهز للطباعة</span></div><div id="reportPreview"><div class="empty">اختر نوع التقرير والفترة ثم اضغط «إنشاء التقرير»</div></div></section>`}

function buildReport(){const type=document.getElementById('reportType')?.value||'transfers',from=document.getElementById('reportFrom')?.value||monthStart(),to=document.getElementById('reportTo')?.value||todayISO(),clinic=document.getElementById('reportClinic')?.value||'all';if(from>to){toast('تاريخ البداية يجب أن يسبق تاريخ النهاية');return}let title='',html='';const txs=state.transactions.filter(t=>t.date>=from&&t.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
 if(type==='inventory'){title='تقرير جرد المخزون وتقييمه';const c=calcInventory(to);let totalValue=0,totalQty=0;const rows=state.items.map(it=>{const per=state.clinics.filter(cl=>clinic==='all'||clinic===cl.id).map(cl=>({cl,q:c.balances[it.id]?.[cl.id]||0}));const q=per.reduce((a,x)=>a+x.q,0);const avg=c.avgCosts[it.id]||0;totalQty+=q;totalValue+=q*avg;return `<tr><td>${esc(it.name)}</td><td class="ltr">${esc(it.sku)} / ${esc(it.barcode)}</td><td>${esc(it.unit)}</td><td>${per.map(x=>`${esc(x.cl.name)}: ${qtyfmt(x.q)}`).join('<br>')}</td><td>${qtyfmt(q)}</td><td>${money(avg)}</td><td>${money(q*avg)}</td></tr>`}).filter(r=>true).join('');html=`<div class="report-summary"><div>إجمالي الكميات<strong>${qtyfmt(totalQty)}</strong></div><div>القيمة الإجمالية<strong>${money(totalValue)} د.ك</strong></div><div>عدد الأصناف<strong>${state.items.length}</strong></div></div><table><thead><tr><th>الصنف</th><th>الكود / الباركود</th><th>الوحدة</th><th>الرصيد حسب الموقع</th><th>الإجمالي</th><th>تكلفة الوحدة (د.ك)</th><th>قيمة الرصيد (د.ك)</th></tr></thead><tbody>${rows}</tbody></table>`;}
 else {let selected=txs.filter(t=>type==='all'||(type==='transfers'?t.type==='transfer':type==='purchases'?t.type==='purchase':type==='returns'?t.type==='return':t.type==='loss'));if(type==='transfers'&&clinic!=='all')selected=selected.filter(t=>t.toId===clinic);else if(type!=='transfers'&&clinic!=='all')selected=selected.filter(t=>(t.locationId===clinic||t.fromId===clinic||t.toId===clinic));title=({transfers:'تقرير الأصناف المحولة إلى العيادات',purchases:'تقرير المشتريات والموردين',returns:'تقرير مرتجعات الموردين',losses:'تقرير التوالف والمفقودات',all:'كشف جميع الحركات'})[type];let totalQty=0,totalCost=0;const rows=selected.flatMap(t=>t.lines.map(l=>{const it=getItem(l.itemId),c=calcInventory(t.date),unit=type==='purchases'?Number(l.unitCost)||0:c.avgCosts[l.itemId]||0;totalQty+=l.qty;totalCost+=l.qty*unit;const place=t.type==='transfer'?`${getClinic(t.fromId)?.name||'—'} ← ${getClinic(t.toId)?.name||'—'}`:t.type==='purchase'||t.type==='return'?getSupplier(t.supplierId)?.name||'—':getClinic(t.locationId)?.name||'—';return `<tr><td class="ltr">${esc(t.number)}</td><td>${fmtDate(t.date)}</td><td>${esc(typeLabel(t.type))}</td><td>${esc(place)}</td><td>${esc(it?.name||'صنف محذوف')}</td><td>${esc(it?.sku||'—')}</td><td>${qtyfmt(l.qty)}</td><td>${money(unit)}</td><td>${money(l.qty*unit)}</td></tr>`}));html=`<div class="report-summary"><div>عدد السندات<strong>${selected.length}</strong></div><div>إجمالي الكميات<strong>${qtyfmt(totalQty)}</strong></div><div>إجمالي التكلفة<strong>${money(totalCost)} د.ك</strong></div></div><table><thead><tr><th>رقم السند</th><th>التاريخ</th><th>الحركة</th><th>${type==='transfers'?'من / إلى':type==='purchases'||type==='returns'?'المورد':'الموقع'}</th><th>الصنف</th><th>رقم الصنف</th><th>الكمية</th><th>تكلفة الوحدة</th><th>الإجمالي (د.ك)</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="9" style="text-align:center">لا توجد حركات ضمن الفترة المحددة</td></tr>'}</tbody></table>`;}
 const subtitle=type==='inventory'?`الرصيد حتى تاريخ ${fmtDate(to)}`:`الفترة من ${fmtDate(from)} إلى ${fmtDate(to)}`;const report=`<div class="report-paper"><div class="report-header"><div class="report-brand"><img src="${LOGO}" alt="شعار شانزيليزيه"/><div><h2>مركز شانزيليزيه</h2><p>نظام إدارة ومتابعة المخازن الطبية · الكويت</p></div></div><div class="report-title"><h1>${title}</h1><p>${subtitle}</p></div></div><div class="report-meta"><span><b>تاريخ الإصدار:</b> ${new Date().toLocaleString('ar-KW')}</span><span><b>إعداد:</b> ${esc(currentUser?.name||'')}</span><span><b>العملة:</b> الدينار الكويتي (د.ك)</span></div>${html}<div class="report-footer"><span>مركز شانزيليزيه — تقرير داخلي</span><span>chanz.Store</span></div></div>`;reportCache=report;const preview=document.getElementById('reportPreview');if(preview)preview.innerHTML=report;const t=document.getElementById('reportPreviewTitle');if(t)t.textContent=title;const p=document.getElementById('printReportBtn');if(p)p.disabled=false;}

const I18N_KEYS = Object.keys(I18N).sort((a,b)=>b.length-a.length);
const I18N_REVERSE = Object.fromEntries(Object.entries(I18N).map(([a,b])=>[b,a]));
const EN_KEYS = Object.keys(I18N_REVERSE).sort((a,b)=>b.length-a.length);
function translateString(input){
  let out=String(input??'');
  if(uiLang==='en'){
    if(I18N[out.trim()]) { const lead=out.match(/^\s*/)?.[0]||'', tail=out.match(/\s*$/)?.[0]||''; return lead+I18N[out.trim()]+tail; }
    for(const k of I18N_KEYS) if(out.includes(k)) out=out.split(k).join(I18N[k]);
    out=out.replace(/،/g, ',').replace(/؛/g, ';');
  } else {
    if(I18N_REVERSE[out.trim()]) { const lead=out.match(/^\s*/)?.[0]||'', tail=out.match(/\s*$/)?.[0]||''; return lead+I18N_REVERSE[out.trim()]+tail; }
    for(const k of EN_KEYS) if(out.includes(k)) out=out.split(k).join(I18N_REVERSE[k]);
  }
  return out;
}
function translateTree(root){
  if(!root)return;
  const walk=n=>{
    if(n.nodeType===Node.TEXT_NODE){const v=translateString(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return;}
    if(n.nodeType!==Node.ELEMENT_NODE && n!==root)return;
    if(n.nodeType===Node.ELEMENT_NODE){
      for(const a of ['placeholder','title','aria-label','alt']) if(n.hasAttribute?.(a)){const v=translateString(n.getAttribute(a));if(v!==n.getAttribute(a))n.setAttribute(a,v)}
    }
    for(const c of [...(n.childNodes||[])]) walk(c);
  };
  walk(root);
}
function syncLanguageButtons(){
  const label=uiLang==='ar'?'EN':'AR';
  ['langToggle','loginLangToggle'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=label});
}
function applyLanguage(root=document.body){
  document.documentElement.lang=uiLang;
  document.documentElement.dir=uiLang==='ar'?'rtl':'ltr';
  document.title=uiLang==='ar'?'chanz.Store | شانزيليزيه':'chanz.Store | Chanzelise';
  translateTree(root);
  syncLanguageButtons();
}
function switchLanguage(){
  uiLang=uiLang==='ar'?'en':'ar';try{localStorage.setItem('chanz_store_lang',uiLang);}catch(e){}
  closeModal();
  document.documentElement.lang=uiLang;document.documentElement.dir=uiLang==='ar'?'rtl':'ltr';
  applyLanguage(document.body);
  if(!document.getElementById('appShell').classList.contains('hidden'))renderPage();
  applyLanguage(document.body);
}
const languageObserver=new MutationObserver(records=>{
  for(const rec of records){
    for(const n of rec.addedNodes||[]) if(n.nodeType===Node.ELEMENT_NODE||n.nodeType===Node.TEXT_NODE)translateTree(n);
    if(rec.type==='attributes'&&rec.target)translateTree(rec.target);
  }
});
languageObserver.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['placeholder','title','aria-label','alt']});

function setupCombo(id,kind,selected=''){
  const wrap=document.querySelector(`[data-combo="${id}"]`);if(!wrap)return;
  const input=wrap.querySelector('input:not([type=hidden])'),hidden=document.getElementById(id),menu=document.getElementById(id+'Menu');
  const list=kind==='item'?state.items:kind==='clinic'?state.clinics:state.suppliers;
  const getLabel=o=>kind==='item'?`${displayName(o.name)} · ${o.sku} · ${o.barcode}`:displayName(o.name);
  function render(q=''){
    const items=list.filter(o=>{const hay=kind==='item'?[o.name,displayName(o.name),o.sku,o.barcode].join(' '):[o.name,displayName(o.name)].join(' ');return hay.toLowerCase().includes(q.toLowerCase())});
    menu.innerHTML=items.length?items.slice(0,30).map(o=>`<div class="combo-option" data-id="${o.id}"><span>${esc(getLabel(o))}</span><span class="tag">${kind==='item'?esc(displayName(o.unit)):kind==='clinic'?(o.id===MAIN_ID?translateString('مخزن رئيسي'):translateString('عيادة')):translateString('مورد')}</span></div>`).join(''):(kind==='supplier'&&id==='purchaseSupplier'?`<div class="combo-option" data-add-supplier="1"><span>＋ ${translateString('إضافة مورد جديد بهذا الاسم')}</span><span class="tag">${translateString('مورد جديد')}</span></div>`:`<div class="empty">${translateString('لا توجد نتائج مطابقة')}</div>`);
    wrap.classList.add('open');applyLanguage(menu);
  }
  input.addEventListener('focus',()=>render(input.value));
  input.addEventListener('input',()=>{hidden.value='';render(input.value)});
  menu.addEventListener('click',e=>{
    if(e.target.closest('[data-add-supplier]')){wrap.classList.remove('open');openSupplierFormForPurchase();return;}
    const option=e.target.closest('.combo-option');if(!option)return;const o=list.find(x=>x.id===option.dataset.id);if(!o)return;
    hidden.value=o.id;input.value=getLabel(o);wrap.classList.remove('open');hidden.dispatchEvent(new Event('change'));
  });
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open')});
  if(selected){const o=list.find(x=>x.id===selected);if(o){hidden.value=o.id;input.value=getLabel(o)}}
  return {input,hidden,render};
}
function setupLineCombo(id,selected=''){
  const wrap=document.querySelector(`[data-line-combo="${id}"]`);if(!wrap)return;
  const input=wrap.querySelector('input:not([type=hidden])'),hidden=document.getElementById(id+'Item'),menu=document.getElementById(id+'Menu');
  function render(q=''){
    const found=state.items.filter(x=>(x.name+' '+displayName(x.name)+' '+x.sku+' '+x.barcode).toLowerCase().includes(q.toLowerCase()));
    menu.innerHTML=found.slice(0,25).map(x=>`<div class="combo-option" data-id="${x.id}"><span>${esc(displayName(x.name))} <span class="muted">${esc(x.sku)}</span></span><span class="tag">${esc(x.barcode)}</span></div>`).join('')||`<div class="empty">${translateString('لا يوجد صنف مطابق — أضفه من الإعدادات')}</div>`;
    wrap.classList.add('open');applyLanguage(menu);
  }
  const choose=x=>{hidden.value=x.id;input.value=`${displayName(x.name)} · ${x.sku}`;wrap.classList.remove('open');const l=movementLines.find(y=>y.id===id);if(l)l.itemId=x.id;};
  input.addEventListener('focus',()=>render(input.value));input.addEventListener('input',()=>{hidden.value='';render(input.value)});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const raw=input.value.trim().toLowerCase();const found=state.items.find(x=>x.barcode.toLowerCase()===raw||x.sku.toLowerCase()===raw)||state.items.find(x=>x.name.toLowerCase()===raw);if(found){choose(found);document.getElementById(id+'Qty')?.focus()}else{render(raw);toast('لم يتم العثور على باركود أو رقم صنف مطابق')}}});
  menu.addEventListener('click',e=>{const o=e.target.closest('.combo-option');if(o){const it=getItem(o.dataset.id);if(it)choose(it)}});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))wrap.classList.remove('open')});
  if(selected){const it=getItem(selected);if(it)choose(it)}
}

function calcInventory(asOf=todayISO(),excludeId=''){
  const bal={},avg={};state.items.forEach(it=>{bal[it.id]={};state.clinics.forEach(c=>bal[it.id][c.id]=Number(it.initialStock?.[c.id]||0));avg[it.id]=Number(it.initialCost||it.avgCost||0)});
  const txs=[...state.transactions].filter(t=>t.id!==excludeId&&t.date<=asOf).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||0)-(b.createdAt||0));
  txs.forEach(t=>(t.lines||[]).forEach(l=>{if(!bal[l.itemId])return;const q=Number(l.qty)||0;const totalBefore=Object.values(bal[l.itemId]).reduce((x,y)=>x+y,0);if(t.type==='purchase'){const p=Number(l.unitCost)||0;avg[l.itemId]=totalBefore+q>0?((totalBefore*avg[l.itemId]+q*p)/(totalBefore+q)):p;bal[l.itemId][MAIN_ID]=(bal[l.itemId][MAIN_ID]||0)+q;}else if(t.type==='transfer'){bal[l.itemId][t.fromId]=(bal[l.itemId][t.fromId]||0)-q;bal[l.itemId][t.toId]=(bal[l.itemId][t.toId]||0)+q;}else if(t.type==='return'||t.type==='loss'){bal[l.itemId][t.locationId]=(bal[l.itemId][t.locationId]||0)-q;}}));
  return {balances:bal,avgCosts:avg};
}
function saveMovement(type){
  const f=document.getElementById(type==='purchase'?'purchaseForm':'movementForm');if(!f.reportValidity())return;
  const data=Object.fromEntries(new FormData(f));
  if(type==='purchase'){data.supplierId=document.getElementById('purchaseSupplier').value;if(!data.supplierId){toast('اختر المورد أو أضفه أولاً');return;}}
  if(type==='transfer'){data.fromId=document.getElementById('moveFrom').value;data.toId=document.getElementById('moveTo').value;if(!data.fromId||!data.toId){toast('حدد المخزن المصدر والوجهة');return;}if(data.fromId===data.toId){toast('المخزن المصدر والوجهة يجب أن يكونا مختلفين');return;}}
  if(type==='return'){data.supplierId=document.getElementById('moveSupplier').value;data.locationId=document.getElementById('moveLocation').value;if(!data.supplierId||!data.locationId){toast('حدد المورد والمخزن');return;}}
  if(type==='loss'){data.locationId=document.getElementById('moveLocation').value;if(!data.locationId){toast('حدد المخزن');return;}}
  const lines=[];for(const row of movementLines){const itemId=document.getElementById(row.id+'Item')?.value;const qty=Number(document.getElementById(row.id+'Qty')?.value)||0;const unitCost=Number(document.getElementById(row.id+'Cost')?.value)||0;if(!itemId||qty<=0){toast('أكمل الصنف والكمية في جميع السطور');return;}lines.push({itemId,qty,...(type==='purchase'?{unitCost}:{})});}
  if(!lines.length){toast('أضف صنفًا واحدًا على الأقل');return;}
  const inv=calcInventory(data.date,editingTransactionId);for(const l of lines){if(type==='transfer'&&Number(inv.balances[l.itemId]?.[data.fromId]||0)<l.qty){toast(`الرصيد غير كافٍ للصنف: ${getItem(l.itemId).name}`);return;}if((type==='return'||type==='loss')&&Number(inv.balances[l.itemId]?.[data.locationId]||0)<l.qty){toast(`الرصيد غير كافٍ للصنف: ${getItem(l.itemId).name}`);return;}}
  const old=editingTransactionId?state.transactions.find(t=>t.id===editingTransactionId):null;
  const prefix={purchase:'PUR',transfer:'TR',return:'RT',loss:'LS'}[type];
  const tx={...(old||{}),id:old?.id||uid('tx'),type,number:old?.number||nextNumber(prefix),date:data.date,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now(),lines,notes:data.notes||''};
  if(type==='purchase'){tx.supplierId=data.supplierId;tx.supplierInvoice=data.supplierInvoice||'';delete tx.fromId;delete tx.toId;delete tx.locationId;}
  if(type==='transfer'){tx.fromId=data.fromId;tx.toId=data.toId;delete tx.supplierId;delete tx.locationId;}
  if(type==='return'){tx.supplierId=data.supplierId;tx.locationId=data.locationId;tx.reason=data.reason||'';delete tx.fromId;delete tx.toId;}
  if(type==='loss'){tx.locationId=data.locationId;tx.reason=data.reason||'';delete tx.fromId;delete tx.toId;}
  if(old){const idx=state.transactions.findIndex(t=>t.id===old.id);state.transactions[idx]=tx;audit('تعديل',typeLabel(type),`تعديل السند ${tx.number} — ${txSummary(tx)}`);}
  else{state.transactions.push(tx);audit('إضافة',typeLabel(type),`تسجيل السند ${tx.number} — ${txSummary(tx)} — ${lines.length} صنف`);}
  editingTransactionId='';save();closeModal();renderPage();toast(old?`تم تحديث السند ${tx.number}`:`تم حفظ السند ${tx.number}`);
}
function deleteTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;if(!confirm(`${uiLang==='en'?'Delete voucher':'هل تريد حذف السند'} ${t.number}؟ ${uiLang==='en'?'Stock balances will be recalculated.':'سيتم إعادة احتساب الأرصدة بعد الحذف.'}`))return;state.transactions=state.transactions.filter(x=>x.id!==id);audit('حذف',typeLabel(t.type),`حذف السند ${t.number} — ${txSummary(t)}`);save();renderPage();toast('تم حذف السند وإعادة احتساب الأرصدة');}

/* Native, dependency-free XLSX writer (Open XML + ZIP STORE); works offline. */
const enc=new TextEncoder();
function xmlEscape(v){return String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
function colName(n){let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s;}
function crc32(bytes){let c=0xffffffff;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^0xffffffff)>>>0;}
function u16(n){return [n&255,(n>>>8)&255];}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];}
function concatBytes(parts){let length=0;for(const p of parts)length+=p.length;const out=new Uint8Array(length);let offset=0;for(const p of parts){out.set(p,offset);offset+=p.length;}return out;}
function makeZip(files){
  const locals=[],centrals=[];let offset=0;
  for(const file of files){const name=enc.encode(file.name),data=typeof file.data==='string'?enc.encode(file.data):file.data,crc=crc32(data);
    const local=concatBytes([new Uint8Array([0x50,0x4b,0x03,0x04,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]),name,data]);
    locals.push(local);
    const central=concatBytes([new Uint8Array([0x50,0x4b,0x01,0x02,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name]);
    centrals.push(central);offset+=local.length;
  }
  const centralBytes=concatBytes(centrals),localBytes=concatBytes(locals),end=new Uint8Array([0x50,0x4b,0x05,0x06,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(centralBytes.length),...u32(localBytes.length),...u16(0)]);
  return concatBytes([localBytes,centralBytes,end]);
}
function makeWorksheet(rows){
  const xmlRows=rows.map((row,ri)=>`<row r="${ri+1}">${row.map((value,ci)=>{
    if(value===null||value===undefined||value==='')return '';
    const ref=colName(ci+1)+(ri+1);
    if(typeof value==='number'&&Number.isFinite(value))return `<c r="${ref}"${ri===0?' s="1"':''}><v>${value}</v></c>`;
    if(typeof value==='boolean')return `<c r="${ref}" t="b"${ri===0?' s="1"':''}><v>${value?1:0}</v></c>`;
    return `<c r="${ref}" t="inlineStr"${ri===0?' s="1"':''}><is><t xml:space="preserve">${xmlEscape(value)}</t></is></c>`;
  }).join('')}</row>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><sheetData>${xmlRows}</sheetData><autoFilter ref="A1:${colName(Math.max(1,...rows.map(r=>r.length)))}${Math.max(1,rows.length)}"/></worksheet>`;
}
function createXLSX(sheets,fileName){
  const valid=sheets.map((sh,i)=>({name:(sh.name||`Sheet${i+1}`).replace(/[\\/*?:\[\]]/g,' ').slice(0,31)||`Sheet${i+1}`,rows:sh.rows||[]}));
  const files=[];
  files.push({name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${valid.map((x,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`});
  files.push({name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`});
  files.push({name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${valid.map((x,i)=>`<sheet name="${xmlEscape(x.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`});
  files.push({name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${valid.map((x,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${valid.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`});
  files.push({name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF124C3D"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`});
  valid.forEach((sh,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:makeWorksheet(sh.rows)}));
  const bytes=makeZip(files);downloadBlob(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fileName);
}
function exportAllXLSX(){
  const en=uiLang==='en',L=(a,b)=>en?b:a;
  const inv=calcInventory();
  const stockHead=[L('الصنف','Item'),L('رقم الصنف','SKU'),L('الباركود','Barcode'),L('الوحدة','Unit'),...state.clinics.map(c=>displayName(c.name)),L('إجمالي الكمية','Total Quantity'),L('متوسط تكلفة الوحدة (د.ك)','Avg Unit Cost (KWD)'),L('قيمة المخزون (د.ك)','Stock Value (KWD)'),L('حد إعادة الطلب','Reorder Level')];
  const stockRows=state.items.map(it=>{const qtys=state.clinics.map(c=>Number(inv.balances[it.id]?.[c.id]||0));const total=qtys.reduce((a,b)=>a+b,0),cost=Number(inv.avgCosts[it.id]||0);return [displayName(it.name),it.sku,it.barcode,displayName(it.unit),...qtys,total,cost,total*cost,it.minStock];});
  const itemRows=[[L('الصنف','Item'),L('رقم الصنف','SKU'),L('الباركود','Barcode'),L('الوحدة','Unit'),L('حد إعادة الطلب','Reorder Level'),L('التكلفة الافتتاحية للوحدة (د.ك)','Opening Unit Cost (KWD)'),L('الأرصدة الافتتاحية حسب الموقع','Opening Balances by Location')],...state.items.map(it=>[displayName(it.name),it.sku,it.barcode,displayName(it.unit),it.minStock,it.initialCost||0,state.clinics.map(c=>`${displayName(c.name)}: ${it.initialStock?.[c.id]||0}`).join(' | ')])];
  const transHead=[L('رقم السند','Voucher No.'),L('نوع الحركة','Type'),L('التاريخ','Date'),L('المورد','Supplier'),L('من','From'),L('إلى','To'),L('الموقع','Location'),L('السبب','Reason'),L('ملاحظات','Notes')];
  const transRows=state.transactions.map(t=>[t.number,typeLabel(t.type),t.date,displayName(getSupplier(t.supplierId)?.name||''),displayName(getClinic(t.fromId)?.name||''),displayName(getClinic(t.toId)?.name||''),displayName(getClinic(t.locationId)?.name||''),displayName(t.reason||''),displayName(t.notes||'')]);
  const lineHead=[L('رقم السند','Voucher No.'),L('التاريخ','Date'),L('نوع الحركة','Type'),L('الصنف','Item'),L('رقم الصنف','SKU'),L('الباركود','Barcode'),L('الكمية','Quantity'),L('تكلفة الوحدة (د.ك)','Unit Cost (KWD)'),L('إجمالي السطر (د.ك)','Line Total (KWD)')];
  const lineRows=state.transactions.flatMap(t=>t.lines.map(l=>{const it=getItem(l.itemId);const c=calcInventory(t.date);const unit=t.type==='purchase'?Number(l.unitCost)||0:Number(c.avgCosts[l.itemId]||0);return [t.number,t.date,typeLabel(t.type),displayName(it?.name||''),it?.sku||'',it?.barcode||'',Number(l.qty)||0,unit,unit*Number(l.qty||0)];}));
  const suppliers=[[L('المورد','Supplier'),L('الهاتف','Phone'),L('البريد الإلكتروني','Email'),L('العنوان','Address')],...state.suppliers.map(x=>[displayName(x.name),x.phone||'',x.email||'',displayName(x.address||'')])];
  const clinics=[[L('الموقع','Location'),L('Type','النوع')],...state.clinics.map(x=>[displayName(x.name),x.kind==='main'?L('مخزن رئيسي','Main Store'):L('عيادة','Clinic')])];
  const logRows=[[L('Date & Time','التاريخ والوقت'),L('المستخدم','User'),L('الصلاحية','Role'),L('العملية','Action'),L('القسم','Section'),L('التفاصيل','Details'),L('نوع الجهاز','Device Type'),L('النظام','Platform'),L('الشاشة','Screen')],...state.logs.map(x=>[x.time,displayName(x.user),displayName(x.role==='manager'?'مدير':'عادي'),displayName(x.action),displayName(x.entity),displayName(x.details),displayName(x.deviceType),displayName(x.platform),x.screen])];
  const sheets=[{name:L('المخزون','Inventory'),rows:[stockHead,...stockRows]},{name:L('الأصناف','Items'),rows:itemRows},{name:L('الحركات','Transactions'),rows:[transHead,...transRows]},{name:L('تفاصيل الحركات','Transaction Lines'),rows:[lineHead,...lineRows]},{name:L('الموردون','Suppliers'),rows:suppliers},{name:L('المواقع','Locations'),rows:clinics}];if(currentUser?.role==='manager')sheets.push({name:L('سجل التدقيق','Audit Log'),rows:logRows});
  createXLSX(sheets,`chanz-store-${todayISO()}.xlsx`);audit('تصدير','Excel','Exported full workbook to XLSX');
}
function exportReportXLSX(){
  const preview=document.getElementById('reportPreview');if(!preview||!preview.querySelector('table')){toast(uiLang==='en'?'Generate a report first':'أنشئ التقرير أولاً');return;}
  const title=document.getElementById('reportPreviewTitle')?.textContent||'Report';
  const table=preview.querySelector('table');const rows=[...table.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>td.innerText.trim()));
  const summary=[...preview.querySelectorAll('.report-summary div')].map(d=>d.innerText.trim());
  createXLSX([{name:uiLang==='en'?'Report':'التقرير',rows:[[title],summary,...rows]}],`chanz-report-${todayISO()}.xlsx`);audit('تصدير','Excel',`تصدير ${title} بصيغة XLSX`);
}

/* Display the audit timestamps in Latin digits and apply language to the entire log page. */
function renderAudit(){
  if(currentUser?.role!=='manager')return `<div class="panel">${translateString('غير مصرح')}</div>`;
  return `${pageHead('حركة السجل','سجل تدقيق يتضمن الدخول والعمليات والتعديلات والحذف وبيانات المتصفح والجهاز',`<button class="btn" onclick="exportAuditCSV()">⬇ ${uiLang==='en'?'Export CSV':'تصدير CSV'}</button>`)}<section class="panel"><div class="filters"><div class="filter-search"><input class="searchbox" placeholder="ابحث بالمستخدم أو العملية أو التفاصيل" oninput="filterTable('auditTable',this.value)" /></div><div class="filter-small"><select class="searchbox" onchange="filterAudit(this.value)"><option value="all">كل العمليات</option><option value="تسجيل دخول">تسجيل دخول</option><option value="فتح البرنامج">فتح البرنامج</option><option value="إضافة">إضافة</option><option value="تعديل">تعديل</option><option value="حذف">حذف</option></select></div></div><div class="table-wrap"><table id="auditTable"><thead><tr><th>التاريخ والوقت</th><th>المستخدم</th><th>العملية</th><th>القسم</th><th>التفاصيل</th><th>بيانات الجهاز والمتصفح</th></tr></thead><tbody>${state.logs.map(l=>`<tr data-search="${esc((l.user+' '+l.action+' '+l.entity+' '+l.details+' '+l.device).toLowerCase())}" data-action="${esc(l.action)}"><td class="num">${new Date(l.time).toLocaleString('en-GB')}</td><td>${esc(displayName(l.user))}<br><span class="tiny muted">${l.role==='manager'?'مدير':'عادي'}</span></td><td><span class="badge ${l.action==='حذف'?'red':l.action==='إضافة'?'green':l.action==='تعديل'?'orange':'blue'}">${esc(l.action)}</span></td><td>${esc(displayName(l.entity))}</td><td>${esc(displayName(l.details))}</td><td><span class="tiny">${esc(displayName(l.deviceType||'جهاز'))} · ${esc(l.platform)} · ${esc(l.screen)}</span><br><span class="tiny muted">${esc(l.language||'')} · ${esc(l.timezone||'')}<br>${esc(l.device).slice(0,115)}</span></td></tr>`).join('')}</tbody></table></div><div class="toolbar"><span class="tiny muted">عدد السجلات: ${state.logs.length} · يحتفظ النظام بآخر 5000 سجل</span></div></section>`;
}

/* Re-apply translation to freshly rendered dropdown options, reports and modals. */
applyLanguage(document.body);

// Initial page-load audit is kept as an anonymous browser event until a user signs in.
state.logs.unshift({id:uid('log'),time:new Date().toISOString(),user:'غير مسجل',role:'guest',action:'فتح صفحة الدخول',entity:'النظام',details:'فتح صفحة تسجيل الدخول',device:navigator.userAgent,deviceType:deviceLabel(),platform:navigator.platform||'غير معروف',language:navigator.language||'غير معروف',timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||'غير معروف',screen:`${screen.width}×${screen.height}`});save();

</script>
